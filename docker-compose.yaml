
services:
  mongo:
    image: mongo:7
    container_name: tavora-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    container_name: tavora-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: tavora
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: tavora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mongo_data: